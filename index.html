<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Adventure Invite</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <section id="startScreen" class="start-screen">
    <div class="start-card">
      <h1>Wedding Adventure</h1>
      <p class="subtitle">Choose your team and begin the quest.</p>

      <div id="formMessage" class="form-message hidden"></div>

      <div id="teamButtons" class="team-buttons">
        <button id="groomButton" class="team-button" onclick="selectSide('groom')">
          🤵 Team Groom
        </button>

        <button id="brideButton" class="team-button" onclick="selectSide('bride')">
          👰 Team Bride
        </button>
      </div>

      <input
        id="playerName"
        type="text"
        placeholder="Enter your name"
        maxlength="15"
      />

      <button class="start-button" onclick="startGame()">
        Start Game
      </button>
    </div>
  </section>

  <section id="gameScreen" class="game-screen">
    <div class="hud">
      <div>Player: <span id="welcomeText">Player</span></div>
      <div>Score: <span id="score">0</span></div>
      <div>Lives: <span id="lives">❤️❤️❤️</span></div>
    </div>

    <canvas id="gameCanvas" width="900" height="500"></canvas>
  </section>

  <div id="eventOverlay" class="event-overlay hidden">
    <div class="event-card">
      <h2 id="eventTitle">Sangeet Night</h2>
      <p id="eventDate">12 December 2026</p>
      <p id="eventTime">7:00 PM onwards</p>
      <p id="eventVenue">Grand Ballroom</p>

      <button onclick="closeEvent()">Continue</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
