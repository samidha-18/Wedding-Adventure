<!DOCTYPE html>
<html>
<head>
  <title>Wedding Platformer Invite</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div id="startScreen">
    <h1>Wedding Platformer Invite</h1>

    <button onclick="selectSide('groom')">Groom Side 🤵</button>
    <button onclick="selectSide('bride')">Bride Side 👰</button>

    <br><br>

    <input id="playerName" type="text" placeholder="Enter Player Name">

    <br><br>

    <button onclick="startGame()">Start Game</button>
  </div>

  <div id="gameScreen" style="display:none;">
    <div id="hud">
      <span id="welcomeText"></span>
      <span>Score: <b id="score">0</b></span>
      <span>Lives: <b id="lives">❤️❤️❤️</b></span>
    </div>

    <canvas id="gameCanvas" width="900" height="500"></canvas>

    <p>Use ← → to move. Space to jump.</p>
  </div>

  <div id="eventOverlay" class="overlay hidden">
    <div class="eventCard">
      <h2 id="eventTitle">Sangeet Night</h2>
      <p id="eventDate">12 December 2026</p>
      <p id="eventTime">7:00 PM onwards</p>
      <p id="eventVenue">Grand Ballroom</p>
      <button onclick="closeEvent()">Continue</button>
    </div>
  </div>

  <script src="js/game.js"></script>

</body>
</html>
