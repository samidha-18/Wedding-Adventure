<!DOCTYPE html>
<html>
<head>
  <title>Wedding Platformer Invite</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div id="startScreen">
    <h1>Wedding Platformer Invite</h1>

    <button onclick="selectSide('groom')">Groom Side 🤵</button>
    <button onclick="selectSide('bride')">Bride Side 👰</button>

    <br><br>

    <input id="playerName" type="text" placeholder="Enter Player Name">

    <br><br>

    <button onclick="startGame()">Start Game</button>
  </div>

  <div id="gameScreen" style="display:none;">
    <h2 id="welcomeText"></h2>
    <p>Game has started 🎮</p>
  </div>

  <script src="js/game.js"></script>

</body>
</html>
